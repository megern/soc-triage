[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-triage"
version = "0.2.0"
description = "SOC authentication-event triage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/megern/soc-triage"
Issues = "https://github.com/megern/soc-triage/issues"

[project.scripts]
soc-triage = "triage:main"

[tool.setuptools]
py-modules = ["triage"]

